# Pulse behind the server's existing nginx. Only affects attend.getzylo.site.
# Install:
#   sudo cp deploy/nginx/attend.getzylo.site.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/attend.getzylo.site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d attend.getzylo.site     # adds HTTPS + the http→https redirect
# The port in proxy_pass must match APP_PORT in the app's .env.

server {
    listen 80;
    listen [::]:80;
    server_name attend.getzylo.site;

    # CSV member imports are posted as one body (≤ 2000 rows).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3061;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Exactly one value, the real client IP. Don't use $proxy_add_x_forwarded_for:
        # it passes on whatever the client sent, and the sign-in rate limits key on it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Pages stream (React Suspense); buffering would hold them until fully rendered.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # HTTPS only for this host from now on (the app sends its other security headers).
    add_header Strict-Transport-Security "max-age=31536000" always;
}
