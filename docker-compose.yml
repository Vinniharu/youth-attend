# Development stack. Phase 7 adds the scheduler; docker-compose.prod.yml (Phase 9) adds Caddy.
services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql # PG 18+ path (not /var/lib/postgresql/data)
    ports:
      # Dev only, loopback only, so the app can run on the host. Override DB_PORT if 5432 is taken.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://church:${DB_PASSWORD}@db:5432/attendance
    ports:
      - "${APP_PORT:-3000}:3000" # override APP_PORT if 3000 is taken
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
